name: Apply Superhuman Atlas retention v0.1.1

on:
  push:
    branches:
      - agent/superhuman-atlas-foundation
    paths:
      - scripts/apply-retention-v0.1.1.mjs
      - .github/workflows/apply-retention-v0.1.1.yml

permissions:
  contents: write

concurrency:
  group: apply-superhuman-atlas-retention-v0.1.1
  cancel-in-progress: false

jobs:
  patch-test-build-and-commit:
    runs-on: windows-latest

    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/superhuman-atlas-foundation
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Apply retention and prerequisite patch
        run: node scripts/apply-retention-v0.1.1.mjs

      - name: Install dependencies
        run: npm install

      - name: Run all tests
        run: npm test

      - name: Build v0.1.1 Windows installers
        run: npm run build

      - name: Collect installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path retention-build -Force | Out-Null
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          $msi = Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" | Select-Object -First 1
          if (-not $exe) { throw "NSIS installer was not created." }
          if (-not $msi) { throw "MSI installer was not created." }
          Copy-Item $exe.FullName "retention-build/Superhuman-Atlas_0.1.1_x64-setup.exe"
          Copy-Item $msi.FullName "retention-build/Superhuman-Atlas_0.1.1_x64_en-US.msi"

      - name: Upload tested Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Superhuman-Atlas-Windows-v0.1.1
          path: retention-build/*
          if-no-files-found: error
          retention-days: 90

      - name: Remove temporary patch machinery
        shell: pwsh
        run: |
          Remove-Item "scripts/apply-retention-v0.1.1.mjs" -Force
          Remove-Item ".github/workflows/apply-retention-v0.1.1.yml" -Force

      - name: Commit validated source changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add skill retention and enforce prerequisites"
          git push origin HEAD:agent/superhuman-atlas-foundation
