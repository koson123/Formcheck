name: Superhuman Atlas CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - agent/superhuman-atlas-foundation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: superhuman-atlas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Apply retention and prerequisite patch
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          if (Test-Path "scripts/apply-retention-v0.1.1.mjs") {
            node scripts/apply-retention-v0.1.1.mjs
          }

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build web application
        run: npm run build:web

      - name: Build Windows installers
        run: npm run build

      - name: Collect installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifact -Force | Out-Null
          Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Copy-Item -Destination artifact
          Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" | Copy-Item -Destination artifact

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Superhuman-Atlas-Windows-v0.1.1
          path: artifact/*
          if-no-files-found: error

      - name: Commit validated retention source
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          if (-not (git status --porcelain)) {
            Write-Host "No source changes to commit."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add skill retention and enforce prerequisites"
          git push origin HEAD:agent/superhuman-atlas-foundation
