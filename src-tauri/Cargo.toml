[package]
name = "formcheck"
version = "0.2.1"
description = "Offline calisthenics skill tree and form checker"
authors = ["Trevor Gardner"]
edition = "2021"

[lib]
name = "formcheck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
